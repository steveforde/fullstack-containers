name: E2E Tests

on:
  push:
    branches: [ main, master ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Start todo-app with Docker Compose
        working-directory: ./todo-app
        run: docker compose up -d --build --force-recreate

      - name: Wait for Backend API to be ready
        run: |
          echo "Waiting for Backend API (via Nginx on port 8080)..."
          timeout 120 bash -c 'until curl -f http://localhost:8080/api/todos > /dev/null 2>&1; do echo "Backend not ready yet... waiting 3s" && sleep 3; done'
          echo "Backend API is successfully responding!"

      - name: Check running containers
        run: docker ps

      - name: Install dependencies
        working-directory: ./todo-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./todo-tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./todo-tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: todo-tests/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: todo-tests/test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        working-directory: ./todo-app
        run: |
          echo "=== Container logs ==="
          docker compose logs

      - name: Clean up Docker containers
        if: always()
        working-directory: ./todo-app
        run: docker compose down -v
